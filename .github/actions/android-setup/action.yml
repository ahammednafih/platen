name: Android setup
description: JDK, Android SDK and NDK, the Android Rust target and cargo-ndk, for building the Android app.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: 21
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
    - name: NDK and the Android Rust target
      shell: bash
      run: |
        sdkmanager --install "ndk;30.0.16248370" > /dev/null
        rustup target add aarch64-linux-android
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        key: android
    - name: cargo-ndk
      shell: bash
      run: command -v cargo-ndk || cargo install cargo-ndk --locked
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
