# Push a tag like v0.3.0 to build the app and publish a GitHub release with the .dmg and the CLI.
# If a tag's run gets stuck, start it by hand: Actions → Release → Run workflow, with the tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.3.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Tag must match the app version
        run: |
          version=$(node -p "require('./app/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match app/package.json version $version"
            exit 1
          fi

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Test
        run: cargo test --workspace

      - name: Build the app (Apple silicon + Intel)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm tauri build --target universal-apple-darwin

      - name: Build the CLI (Apple silicon + Intel)
        run: |
          cargo build --release -p platen-cli --target aarch64-apple-darwin --target x86_64-apple-darwin
          lipo -create -output platen target/aarch64-apple-darwin/release/platen target/x86_64-apple-darwin/release/platen
          tar -czf "platen-cli-$TAG-macos-universal.tar.gz" platen

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --generate-notes \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            platen-cli-*.tar.gz
