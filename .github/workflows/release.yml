# Push a tag like v0.3.0 to build the apps and publish a GitHub release with the .dmg, the CLI and the Android APK.
# With the PLAY_TRACK repository variable set (e.g. internal), the Android bundle also goes to that Google Play track.
# Tests run in CI on main, not here; the release stops if CI hasn't passed on the tagged commit.
# If a tag's run gets stuck, start it by hand: Actions → Release → Run workflow, with the tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.3.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  checks: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Tag must match the app version
        run: |
          version=$(node -p "require('./app/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match app/package.json version $version"
            exit 1
          fi

      - name: CI must have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=test" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI hasn't passed on $sha. Wait for it, or fix it, then run this again."
            exit 1
          fi

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the build number is the commit count
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - uses: ./.github/actions/android-setup

      - name: Build the signed APK and bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
          ./gradlew :app:assembleRelease :app:bundleRelease -PversionName="${TAG#v}"
          rm "$ANDROID_KEYSTORE"
          mv app/build/outputs/apk/release/app-release.apk "../platen-$TAG-android.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: platen-*-android.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-bundle
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt

  play:
    needs: [checks, android]
    if: vars.PLAY_TRACK != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-bundle
          path: bundle

      - name: What's new
        run: |
          mkdir whatsnew
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$prev" ] && ! git diff --quiet "$prev" "$TAG" -- android/whatsnew.txt; then
            notes=$(cat android/whatsnew.txt)
          else
            notes="Fixes and improvements."
          fi
          LC_ALL=C.UTF-8; printf '%s' "${notes:0:500}" > whatsnew/whatsnew-en-US

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kanamlabs.platen
          releaseFiles: bundle/bundle/release/app-release.aab
          mappingFile: bundle/mapping/release/mapping.txt
          releaseName: ${{ env.TAG }}
          track: ${{ vars.PLAY_TRACK }}
          status: ${{ vars.PLAY_TRACK == 'production' && 'draft' || 'completed' }}
          whatsNewDirectory: whatsnew

  release:
    needs: [checks, android]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the release notes read history back to the previous tag

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build the app (Apple silicon + Intel)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm tauri build --target universal-apple-darwin

      - name: Build the CLI (Apple silicon + Intel)
        run: |
          cargo build --release -p platen-cli --target aarch64-apple-darwin --target x86_64-apple-darwin
          lipo -create -output platen target/aarch64-apple-darwin/release/platen target/x86_64-apple-darwin/release/platen
          tar -czf "platen-cli-$TAG-macos-universal.tar.gz" platen

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/release-notes.sh "$TAG" > notes.md
          gh release create "$TAG" --notes-file notes.md \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            platen-cli-*.tar.gz \
            platen-*-android.apk
