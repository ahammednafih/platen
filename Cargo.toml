[workspace]
resolver = "3"
members = ["crates/core", "crates/tui", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
platen-core = { path = "crates/core" }

# Image decoding and JPEG encoding are 20-50x slower unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
