[package]
name = "platen-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
image.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
mdns-sd = "0.21.7"
ureq = "3.5.1"
lopdf = { version = "0.47.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFURL", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPDFDocument", "CGPDFPage", "CGAffineTransform"] }
security-framework = "3.7.0"
