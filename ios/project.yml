name: Platen
options:
  bundleIdPrefix: com.kanamlabs
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: MTJBNQ42H6
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.5.2"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
targets:
  Platen:
    type: application
    platform: iOS
    sources:
      - path: Platen
      - path: Generated/platen_mobile.swift
        optional: true
    preBuildScripts:
      - name: Build Rust core
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/platen_mobile.swift
          - $(SRCROOT)/../target/aarch64-apple-ios/release/libplaten_mobile.a
          - $(SRCROOT)/../target/aarch64-apple-ios-sim/release/libplaten_mobile.a
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanamlabs.platen
        PRODUCT_NAME: Platen
        INFOPLIST_FILE: Platen/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        OTHER_LDFLAGS: $(SRCROOT)/../target/aarch64-apple-ios/release/libplaten_mobile.a
        OTHER_LDFLAGS[sdk=iphonesimulator*]: $(SRCROOT)/../target/aarch64-apple-ios-sim/release/libplaten_mobile.a
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DISPLAY_NAME: Platen
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.kanamlabs.platen.dev
          DISPLAY_NAME: Platen (Dev)
